<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Poppins';font-weight:900;src:url('../assets/fonts/poppins-latin-900-normal.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:800;src:url('../assets/fonts/poppins-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url('../assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.sh{position:absolute;pointer-events:none}
.logo{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:10}
.logo img{height:94px;width:auto;display:block}
.block{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);width:920px;text-align:center;z-index:10}
.hd{font-family:'Poppins',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1.04;font-size:96px;color:#fff}
.hd .k{color:#a4d435}
.bd{font-family:'Inter',sans-serif;font-weight:500;line-height:1.45;font-size:44px;color:#9CA396;margin:36px auto 0;max-width:820px}
.eye{margin-top:50px;display:inline-flex;align-items:center;gap:18px;border:2.5px solid rgba(255,255,255,.5);border-radius:100px;padding:22px 44px;color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.01em} .eye .ar{display:block;margin-top:2px}
</style>
</head>
<body>
<div class="card">

  <!-- GIANT 4-point star peak (yellow->lime), only tip shows. Half crisp (right) / half blur (left) -->
  <!-- LEFT half: heavy blur -->
  <svg class="sh" style="bottom:-410px;left:50%;transform:translateX(-50%);width:820px;height:820px;filter:blur(28px);z-index:1;-webkit-mask-image:linear-gradient(to right,#000 42%,transparent 62%);mask-image:linear-gradient(to right,#000 42%,transparent 62%)" viewBox="0 0 100 100">
    <defs><linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3d23e"/><stop offset=".45" stop-color="#d4ec3c"/><stop offset=".75" stop-color="#a7da2c"/><stop offset="1" stop-color="#8fc01a"/></linearGradient></defs>
    <path d="M50 1 C53.5 31 69 46.5 99 50 C69 53.5 53.5 69 50 99 C46.5 69 31 53.5 1 50 C31 46.5 46.5 31 50 1 Z" fill="url(#pk)"/>
  </svg>
  <!-- UNION blend: medium blur over the seam, amalgamates the two halves -->
  <svg class="sh" style="bottom:-410px;left:50%;transform:translateX(-50%);width:820px;height:820px;filter:blur(13px);z-index:2;-webkit-mask-image:linear-gradient(to right,transparent 32%,#000 46%,#000 56%,transparent 70%);mask-image:linear-gradient(to right,transparent 32%,#000 46%,#000 56%,transparent 70%)" viewBox="0 0 100 100">
    <defs><linearGradient id="pkb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3d23e"/><stop offset=".45" stop-color="#d4ec3c"/><stop offset=".75" stop-color="#a7da2c"/><stop offset="1" stop-color="#8fc01a"/></linearGradient></defs>
    <path d="M50 1 C53.5 31 69 46.5 99 50 C69 53.5 53.5 69 50 99 C46.5 69 31 53.5 1 50 C31 46.5 46.5 31 50 1 Z" fill="url(#pkb)"/>
  </svg>
  <!-- RIGHT half: crisp -->
  <svg class="sh" style="bottom:-410px;left:50%;transform:translateX(-50%);width:820px;height:820px;filter:blur(3px);z-index:3;-webkit-mask-image:linear-gradient(to left,#000 42%,transparent 62%);mask-image:linear-gradient(to left,#000 42%,transparent 62%)" viewBox="0 0 100 100">
    <defs><linearGradient id="pk2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3d23e"/><stop offset=".45" stop-color="#d4ec3c"/><stop offset=".75" stop-color="#a7da2c"/><stop offset="1" stop-color="#8fc01a"/></linearGradient></defs>
    <path d="M50 1 C53.5 31 69 46.5 99 50 C69 53.5 53.5 69 50 99 C46.5 69 31 53.5 1 50 C31 46.5 46.5 31 50 1 Z" fill="url(#pk2)"/>
  </svg>

  <!-- logo -->
  <div class="logo"><img src="../assets/uc-lime.png" alt="UC"></div>

  <!-- text block -->
  <div class="block">
    <p class="hd">AI creators,<br>content and mass<br><span class="k">distribution.</span></p>
    <p class="bd">Launch viral campaigns powered by armies of AI creators.</p>
    <div class="eye">Swipe <svg class="ar" width="46" height="24" viewBox="0 0 46 24" fill="none"><path d="M3 12 H40 M30 4 L41 12 L30 20" stroke="#a4d435" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

</div>
</body>
</html>
