<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Poppins';font-weight:900;src:url('../assets/fonts/poppins-latin-900-normal.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:800;src:url('../assets/fonts/poppins-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.sh{position:absolute;pointer-events:none}
.logo{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:10}
.logo img{height:94px;width:auto;display:block}
.block{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);width:920px;text-align:center;z-index:10}
.hd{font-family:'Poppins',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1.08;font-size:90px;color:#fff}
.hd .k{color:#a4d435}
.bd{font-family:'Inter',sans-serif;font-weight:500;line-height:1.55;font-size:44px;color:#9CA396;margin:50px auto 0;max-width:820px}
.cta{display:inline-flex;align-items:center;border-radius:100px;font-family:'Poppins',sans-serif;font-weight:800;font-size:42px;letter-spacing:-.01em;padding:28px 62px;background:#8fc01a;color:#1c1d18;margin-top:66px}
</style>
</head>
<body>
<div class="card">

  <!-- 4 distinct shapes, all in the soft restrained "blur depth" brand treatment -->
  <!-- lavender amoeba blob, top-left -->
  <svg class="sh" style="top:-165px;left:-135px;width:380px;height:380px;filter:blur(30px);opacity:.7;z-index:1" viewBox="0 0 100 100"><path d="M52 7 C77 3 97 19 93 43 C101 63 86 86 61 90 C39 101 13 89 9 64 C1 43 15 16 52 7 Z" fill="#a78bfa"/></svg>
  <!-- yellow eye, top-right -->
  <svg class="sh" style="top:-55px;right:-70px;width:340px;height:238px;filter:blur(28px);opacity:.66;transform:rotate(16deg);z-index:1" viewBox="0 0 100 70"><path d="M3 35 C28 6 72 6 97 35 C72 64 28 64 3 35 Z" fill="#FBBF24"/></svg>
  <!-- magenta capsule pill, bottom-left (tilted) -->
  <div class="sh" style="bottom:-40px;left:-120px;width:380px;height:150px;border-radius:75px;background:#ec4899;filter:blur(30px);opacity:.6;transform:rotate(-30deg);z-index:1"></div>
  <!-- orange 5-point star, bottom-right -->
  <svg class="sh" style="bottom:-140px;right:-115px;width:350px;height:350px;filter:blur(30px);opacity:.64;z-index:1" viewBox="0 0 100 100"><polygon points="50,2 61,38 99,38 68,61 79,97 50,74 21,97 32,61 1,38 39,38" fill="#F97316"/></svg>

  <!-- logo -->
  <div class="logo"><img src="../assets/uc-lime.png" alt="UC"></div>

  <!-- text block -->
  <div class="block">
    <p class="hd">Welcome to the<br>new era of<br><span class="k">AI creators.</span></p>
    <p class="bd">Link sound, logo, clips.<br>Usecreable connects to AI creators ready to create and post.</p>
    <div class="cta">usecreable.com</div>
  </div>

</div>
</body>
</html>
