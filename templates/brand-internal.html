<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Poppins';font-weight:900;src:url('../assets/fonts/poppins-latin-900-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.sh{position:absolute;pointer-events:none}
.logo{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:10}
.logo img{height:94px;width:auto;display:block}
.block{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;text-align:center;z-index:10}
.hd{font-family:'Poppins',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1.06;font-size:90px;color:#fff}
.hd .k{color:#a4d435}
.bd{font-family:'Inter',sans-serif;font-weight:500;line-height:1.5;font-size:48px;color:#9CA396;margin:36px auto 0;max-width:840px}
</style>
</head>
<body>
<div class="card">

  <!-- brand "blur depth": subtle, soft blurred shapes bleeding off corners (text dominates) -->
  <!-- lavender flower, top-right (soft bloom) -->
  <svg class="sh" style="top:-170px;right:-140px;width:380px;height:380px;filter:blur(20px);opacity:.9;z-index:1" viewBox="0 0 100 100">
    <circle cx="50" cy="24" r="24" fill="#a78bfa"/><circle cx="76" cy="50" r="24" fill="#a78bfa"/><circle cx="50" cy="76" r="24" fill="#a78bfa"/><circle cx="24" cy="50" r="24" fill="#a78bfa"/><circle cx="50" cy="50" r="26" fill="#a78bfa"/>
  </svg>
  <!-- magenta drop, bottom-left -->
  <svg class="sh" style="bottom:-130px;left:-100px;width:320px;height:372px;filter:blur(22px);opacity:.78;z-index:1" viewBox="0 0 100 116"><path d="M50 6 C50 6 86 54 86 74 C86 96 70 110 50 110 C30 110 14 96 14 74 C14 54 50 6 50 6 Z" fill="#ec4899"/></svg>

  <!-- logo -->
  <div class="logo"><img src="../assets/uc-lime.png" alt="UC"></div>

  <!-- text block -->
  <div class="block">
    <p class="hd">One more post<br>isn't <span class="k">the answer.</span></p>
    <p class="bd">Your brand needs viral mass posting campaigns, not isolated content.</p>
  </div>

</div>
</body>
</html>
