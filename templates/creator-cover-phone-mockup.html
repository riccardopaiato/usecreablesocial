<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Poppins';font-weight:900;src:url('../assets/fonts/poppins-latin-900-normal.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:800;src:url('../assets/fonts/poppins-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Poppins';font-weight:700;src:url('../assets/fonts/poppins-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:600;src:url('../assets/fonts/inter-latin-600-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;background:#f7f4ec;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.sh{position:absolute;pointer-events:none}
.logo{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:10}
.logo img{height:88px;width:auto;display:block}
.block{position:absolute;top:240px;left:50%;transform:translateX(-50%);width:864px;text-align:center;z-index:10}
.hd{font-family:'Poppins',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-size:80px;color:#1c1d18}
.hd .k{color:#8fc01a}
.bd{font-family:'Inter',sans-serif;font-weight:500;line-height:1.5;font-size:38px;color:#5c5e52;margin:28px auto 0;max-width:760px}

/* phone mockup */
.phone{position:absolute;bottom:64px;left:50%;transform:translateX(-50%) rotate(-3deg);width:330px;height:560px;background:#1c1d18;border-radius:46px;padding:14px;z-index:9;box-shadow:0 26px 60px rgba(28,29,24,.22)}
.screen{width:100%;height:100%;background:#faf8f2;border-radius:34px;overflow:hidden;padding:26px 24px;display:flex;flex-direction:column;gap:18px}
.pr{display:flex;align-items:center;gap:10px}
.pr .m{width:34px;height:26px;background:url('../assets/uc-lime.png') center/contain no-repeat}
.pr .t{font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;color:#1c1d18;letter-spacing:-.02em}
.earn{background:#1c1d18;border-radius:22px;padding:22px 22px;color:#fff}
.earn .l{font-family:'Inter';font-weight:500;font-size:17px;color:#9CA396}
.earn .n{font-family:'Poppins',sans-serif;font-weight:900;font-size:58px;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.earn .n span{color:#a4d435}
.camp{background:#fff;border:2px solid #efeadd;border-radius:22px;padding:20px}
.camp .bdg{display:inline-block;background:#e6f6c4;color:#527d0d;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.camp .ti{font-family:'Poppins',sans-serif;font-weight:700;font-size:23px;color:#1c1d18;margin-top:12px;line-height:1.2}
.camp .su{font-family:'Inter';font-weight:500;font-size:16px;color:#9CA396;margin-top:4px}
.camp .btn{margin-top:16px;background:#8fc01a;color:#1c1d18;font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;text-align:center;padding:14px;border-radius:14px}
</style>
</head>
<body>
<div class="card">

  <!-- playful flat pastel scatter (top + sides, clear of phone) -->
  <svg class="sh" style="top:-90px;left:-70px;width:300px;height:300px;opacity:.85;z-index:1" viewBox="0 0 100 100"><polygon points="50,2 61,38 99,38 68,61 79,97 50,74 21,97 32,61 1,38 39,38" fill="#FBBF24"/></svg>
  <div class="sh" style="top:30px;right:-80px;width:280px;height:280px;border-radius:50%;background:#a78bfa;opacity:.5;z-index:1"></div>
  <svg class="sh" style="top:560px;left:-60px;width:150px;height:174px;opacity:.55;z-index:1" viewBox="0 0 100 116"><path d="M50 6 C50 6 86 54 86 74 C86 96 70 110 50 110 C30 110 14 96 14 74 C14 54 50 6 50 6 Z" fill="#ec4899"/></svg>
  <svg class="sh" style="top:640px;right:-50px;width:200px;height:200px;opacity:.5;z-index:1" viewBox="0 0 100 100"><polygon points="50,4 96,50 50,96 4,50" fill="#F97316"/></svg>
  <div class="sh" style="bottom:-70px;left:-50px;width:240px;height:240px;border-radius:50%;background:#cdec8d;opacity:.7;z-index:1"></div>
  <div class="sh" style="bottom:30px;right:60px;width:120px;height:120px;border-radius:30%;background:#a78bfa;opacity:.45;transform:rotate(12deg);z-index:1"></div>

  <!-- logo -->
  <div class="logo"><img src="../assets/uc-lime.png" alt="UC"></div>

  <!-- text block -->
  <div class="block">
    <p class="hd">You make AI content.<br>Now turn it into<br><span class="k">income.</span></p>
    <p class="bd">Brands pay creators to post AI content.<br>Usecreable connects you to them.</p>
  </div>

  <!-- phone mockup -->
  <div class="phone">
    <div class="screen">
      <div class="pr"><div class="m"></div><div class="t">Creator</div></div>
      <div class="earn"><div class="l">Earnings this month</div><div class="n"><span>$2,480</span></div></div>
      <div class="camp">
        <div class="bdg">Campaign available</div>
        <div class="ti">Post AI content</div>
        <div class="su">Earn per view &middot; brief provided</div>
        <div class="btn">View brief</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
