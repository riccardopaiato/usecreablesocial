<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Poppins';font-weight:900;src:url('../assets/fonts/poppins-latin-900-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url('../assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;background:#f7f4ec;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.sh{position:absolute;pointer-events:none}
.logo{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:10}
.logo img{height:94px;width:auto;display:block}
.block{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:864px;text-align:center;z-index:10}
.day{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:38px;letter-spacing:.16em;text-transform:uppercase;color:#8fc01a;margin-bottom:24px}
.hd{font-family:'Poppins',sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1.06;font-size:84px;color:#1c1d18}
.hd .k{color:#8fc01a}
.bd{font-family:'Inter',sans-serif;font-weight:500;line-height:1.5;font-size:44px;color:#5c5e52;margin:36px auto 0;max-width:864px}
</style>
</head>
<body>
<div class="card">

  <!-- flat pastel shapes, scattered (internal: moderate) -->
  <!-- magenta diamond, top-left -->
  <svg class="sh" style="top:-90px;left:-70px;width:300px;height:300px;opacity:.6;z-index:1" viewBox="0 0 100 100"><polygon points="50,4 96,50 50,96 4,50" fill="#ec4899"/></svg>
  <!-- yellow star, top-right -->
  <svg class="sh" style="top:-60px;right:-60px;width:280px;height:280px;opacity:.8;z-index:1" viewBox="0 0 100 100"><polygon points="50,2 61,38 99,38 68,61 79,97 50,74 21,97 32,61 1,38 39,38" fill="#FBBF24"/></svg>
  <!-- lavender soft blob, bottom-right -->
  <svg class="sh" style="bottom:-100px;right:-80px;width:320px;height:320px;opacity:.5;z-index:1" viewBox="0 0 100 100"><path d="M50 6 C74 2 96 22 94 48 C99 74 74 98 48 94 C22 98 4 74 8 48 C4 22 26 10 50 6 Z" fill="#a78bfa"/></svg>
  <!-- orange capsule, bottom-left (tilted) -->
  <div class="sh" style="bottom:30px;left:-100px;width:300px;height:110px;border-radius:55px;background:#F97316;opacity:.55;transform:rotate(-32deg);z-index:1"></div>

  <!-- logo -->
  <div class="logo"><img src="../assets/uc-lime.png" alt="UC"></div>

  <!-- text block -->
  <div class="block">
    <div class="day">Day 1</div>
    <p class="hd">See which campaigns<br>fit <span class="k">your style.</span></p>
    <p class="bd">Artists, podcasters, brands all need mass distribution.<br>Find briefs that match your skills.</p>
  </div>

</div>
</body>
</html>
